# Keeps the Render web service awake.
#
# Render spins a free-plan service down after ~15 minutes with no inbound traffic. The next
# real request then pays a 30-60s cold start, which looks like a hung app on the driver phones
# and used to surface as a forced re-login (see the 401-only logout guard in AppContext.tsx).
#
# src/hooks/useKeepAlive.ts pings /api/health every 4 minutes, but only while somebody has the
# app open in a visible tab. This workflow covers the overnight / nobody-is-using-it gap.
#
# NOTE: GitHub's scheduled runners are best-effort — a `*/10` cron can drift 5-15 minutes under
# load, so this alone is not a hard guarantee of never sleeping. It is a free backstop. For a
# tighter interval use an external pinger (cron-job.org / UptimeRobot) against the same URL.
# GitHub also disables scheduled workflows on repos with no commits for 60 days.
name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub's minimum), well under Render's ~15 min idle window
  workflow_dispatch: {}     # lets you trigger a wake-up by hand from the Actions tab

# Never let a slow cold start pile up overlapping runs.
concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          # --max-time 90 because a cold start can legitimately take ~60s; that slow response
          # IS the wake-up working, so it must not be treated as a failure.
          # --retry 3 covers the case where the very first request is dropped mid-spin-up.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
            https://shivam-transport.onrender.com/api/health)
          echo "HTTP $code"
          cat /tmp/health.json || true
          echo
          # Only a non-2xx is a real failure — the point is that the server answered at all.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Health check returned HTTP $code"
            exit 1
          fi
